<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng ngừng hoạt động — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminDashboard.css}">
</head>
<body>
<main class="wrap dash-main">
    <section class="panel store-inactive-card">
        <div class="eyebrow">CoffeeHRM</div>
        <h1>Cửa hàng ngừng hoạt động</h1>
        <p class="flash error" role="alert" th:text="${message}">Cửa hàng hiện đang ngừng hoạt động. Vui lòng liên hệ Admin để được hỗ trợ.</p>
        <p class="muted">Bạn vẫn có thể đăng xuất. Các chức năng nghiệp vụ sẽ mở lại khi Admin kích hoạt cửa hàng.</p>
        <div class="form-actions">
            <a class="primary-btn" th:href="@{${homeUrl}}">Kiểm tra lại</a>
            <form th:action="@{/logout}" method="post">
                <button class="logout-btn" type="submit">Đăng xuất</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
