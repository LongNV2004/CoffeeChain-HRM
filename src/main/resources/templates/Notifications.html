<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:if="${currentRole == 'ADMIN'}" th:href="@{/css/AdminDashboard.css}">
    <link rel="stylesheet" th:if="${currentRole == 'MANAGER'}" th:href="@{/css/ManagerDashboard.css}">
    <link rel="stylesheet" th:if="${currentRole == 'STAFF'}" th:href="@{/css/StaffDashboard.css}">
    <link rel="stylesheet" th:href="@{/css/Training.css}">
</head>
<body>
<th:block th:if="${currentRole == 'ADMIN'}">
    <header th:replace="~{fragments/navbar :: admin('notifications')}"></header>
</th:block>
<th:block th:if="${currentRole == 'MANAGER'}">
    <header th:replace="~{fragments/navbar :: manager('notifications')}"></header>
</th:block>
<th:block th:if="${currentRole == 'STAFF'}">
    <header th:replace="~{fragments/navbar :: staff('notifications')}"></header>
</th:block>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Tài khoản</div>
        <h1>Thông báo</h1>
        <p>
            <span th:text="${displayName}">User</span>
            · chỉ hiển thị thông báo gửi đến bạn
        </p>
        <p style="margin-top:12px;"><a class="back-link" th:href="${dashboardHome}">← Về dashboard</a></p>
    </section>

    <p class="flash success" th:if="${successMessage}" th:text="${successMessage}">OK</p>
    <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}">Error</p>

    <section class="panel">
        <div class="panel-head">
            <div>
                <h2>Hộp thư của bạn</h2>
                <p>Đánh dấu đã đọc để theo dõi các thông báo mới.</p>
            </div>
            <form th:action="@{/notifications/read-all}" method="post" th:if="${!#lists.isEmpty(notifications)}">
                <button class="primary-btn" type="submit">Đánh dấu tất cả đã đọc</button>
            </form>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(notifications)}">Chưa có thông báo.</p>

        <ul class="notification-list" th:if="${!#lists.isEmpty(notifications)}">
            <li th:each="item : ${notifications}" th:classappend="${item.read} ? 'is-read' : 'is-unread'">
                <div class="notification-head">
                    <strong th:text="${item.title}">Title</strong>
                    <span class="badge" th:classappend="${item.read} ? ' badge-ok' : ' badge-wait'"
                          th:text="${item.read} ? 'Đã đọc' : 'Chưa đọc'">Chưa đọc</span>
                </div>
                <p th:text="${item.message}">Message</p>
                <div class="notification-meta">
                    <span th:text="${item.createdAt != null} ? ${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')} : '—'">time</span>
                    <form th:if="${!item.read}" th:action="@{/notifications/{id}/read(id=${item.id})}" method="post">
                        <button class="link-btn" type="submit">Đánh dấu đã đọc</button>
                    </form>
                </div>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
