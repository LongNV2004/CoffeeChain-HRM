<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm công — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AttendanceHistory.css}">
</head>
<body data-gps-manual="true">
<header th:replace="~{fragments/navbar :: staff('attendance')}"></header>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Cá nhân — Staff</div>
        <h1>Chấm công</h1>
        <p th:if="${clock != null}">
            <span th:text="${clock.employeeName}">Nhân viên</span>
            <span th:if="${clock.storeName != null}" th:text="'· ' + ${clock.storeName}">· Cửa hàng</span>
        </p>
    </section>

    <p class="flash-ok" th:if="${pageMessage}" th:text="${pageMessage}">Thành công</p>
    <p class="flash" th:if="${pageError}" th:text="${pageError}">Lỗi</p>

    <section class="punch-board" th:if="${clock != null}">
        <h2>Ca hôm nay</h2>
        <p class="empty" th:if="${#lists.isEmpty(clock.slots)}">Hôm nay bạn không có ca được phân công.</p>
        <div class="punch-list" th:if="${!#lists.isEmpty(clock.slots)}">
            <article class="punch-card" th:each="slot : ${clock.slots}">
                <div class="slot-top">
                    <h3 th:text="${slot.shiftName}">Ca sáng</h3>
                    <span class="day-badge" th:classappend="${slot.statusKey}" th:text="${slot.statusLabel}">Chưa Check-in</span>
                </div>
                <p class="slot-schedule">Giờ theo lịch: <span th:text="${slot.scheduleLabel}">07:00 – 11:00</span></p>
                <div class="slot-times">
                    <div>
                        <span>Check-in</span>
                        <strong th:text="${slot.checkInLabel}">—</strong>
                    </div>
                    <div>
                        <span>Check-out</span>
                        <strong th:text="${slot.checkOutLabel}">—</strong>
                    </div>
                </div>
                <div class="clock-actions">
                    <form class="gps-form" th:if="${slot.canCheckIn}" th:action="@{/attendance/staff/check-in}" method="post"
                          enctype="multipart/form-data" th:attr="data-preview-url=@{/attendance/staff/check-in/preview}" data-require-photo="true">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="assignmentId" th:value="${slot.assignmentId}">
                        <input type="hidden" name="latitude">
                        <input type="hidden" name="longitude">
                        <input type="hidden" name="accuracy">
                        <input type="file" name="photo" accept="image/jpeg" hidden>
                        <button class="primary-btn" type="submit">Check-in</button>
                    </form>
                    <button class="primary-btn" type="button" th:if="${!slot.canCheckIn}"
                            th:attr="data-check-notice=${slot.checkInNotice}">Check-in</button>
                    <form class="gps-form" th:if="${slot.canCheckOut}" th:action="@{/attendance/staff/check-out}" method="post"
                          enctype="multipart/form-data" th:attr="data-preview-url=@{/attendance/staff/check-out/preview}" data-require-photo="true">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="assignmentId" th:value="${slot.assignmentId}">
                        <input type="hidden" name="latitude">
                        <input type="hidden" name="longitude">
                        <input type="hidden" name="accuracy">
                        <input type="file" name="photo" accept="image/jpeg" hidden>
                        <button class="secondary-btn" type="submit">Check-out</button>
                    </form>
                    <button class="secondary-btn" type="button" th:if="${!slot.canCheckOut}"
                            th:attr="data-check-notice=${slot.checkOutNotice}">Check-out</button>
                </div>
            </article>
        </div>
    </section>

    <section class="panel" th:if="${clock != null}">
        <h2>Lịch sử gần đây</h2>
        <p class="empty" th:if="${#lists.isEmpty(clock.recent)}">Chưa có bản ghi chấm công.</p>
        <ul class="recent-list" th:if="${!#lists.isEmpty(clock.recent)}">
            <li th:each="item : ${clock.recent}">
                <span th:text="${#temporals.format(item.workDate, 'dd/MM/yyyy')}">04/10/2026</span>
                <span th:text="${item.timeLabel}">08:00 - 17:05</span>
            </li>
        </ul>
    </section>
</main>
<script th:src="@{/js/attendance-gps.js(v=9)}"></script>
</body>
</html>
