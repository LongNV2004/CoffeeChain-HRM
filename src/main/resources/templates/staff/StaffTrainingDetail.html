<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết lớp đào tạo — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/StaffDashboard.css}">
    <link rel="stylesheet" th:href="@{/css/Training.css}">
</head>
<body th:attr="data-now=${#temporals.format(vietnamNow, 'yyyy-MM-dd') + 'T' + #temporals.format(vietnamNow, 'HH:mm:ss')},data-end=${!classDetail.ended and classDetail.endDate != null and classDetail.endTime != null ? #temporals.format(classDetail.endDate, 'yyyy-MM-dd') + 'T' + #temporals.format(classDetail.endTime, 'HH:mm:ss') : ''}">
<header th:replace="~{fragments/navbar :: staff('training')}"></header>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Cá nhân — Nhân viên</div>
        <h1 th:text="${classDetail.className}">Tên lớp</h1>
        <p>
            <span th:text="${displayName}">Nhân viên</span>
            <span th:if="${storeName}"> · <span th:text="${storeName}">Store</span></span>
        </p>
        <div style="margin-top:12px;">
        </div>
    </section>

    <section class="panel">
        <h2>Thông tin lớp</h2>
        <dl th:replace="~{fragments/trainingClassView :: classInfo(${classDetail})}"></dl>
    </section>

    <section th:replace="~{fragments/trainingClassView :: ownResult(${classDetail.resultLabel}, ${classDetail.trainingTypeLabel}, ${classDetail.evaluatedAt}, ${classDetail.evaluationNote})}"></section>
</main>
<script th:src="@{/js/training-end-refresh.js}"></script>
</body>
</html>
