<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đào tạo — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/StaffDashboard.css}">
    <link rel="stylesheet" th:href="@{/css/Training.css}">
</head>
<body th:attr="data-now=${#temporals.format(vietnamNow, 'yyyy-MM-dd') + 'T' + #temporals.format(vietnamNow, 'HH:mm:ss')}">
<header th:replace="~{fragments/navbar :: staff('training')}"></header>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Cá nhân — Nhân viên</div>
        <h1>Đào tạo</h1>
        <p>
            <span th:text="${displayName}">Nhân viên</span>
            <span th:if="${storeName}"> · <span th:text="${storeName}">Store</span></span>
        </p>
    </section>

    <p class="flash success" th:if="${successMessage}" th:text="${successMessage}">OK</p>
    <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}">Error</p>

    <section class="panel" id="upcoming">
        <div class="panel-head">
            <div>
                <h2>Lớp đang hoạt động</h2>
            </div>
        </div>
        <table th:replace="~{fragments/trainingClassView :: activeTable(${upcomingClasses}, '/training/staff/classes/{id}', 'Không có lớp đào tạo phù hợp.')}"></table>
    </section>

    <section class="panel" id="history">
        <div class="panel-head">
            <div>
                <h2>Lớp đã kết thúc</h2>
            </div>
        </div>
        <table th:replace="~{fragments/trainingClassView :: endedTable(${historyClasses}, '/training/staff/classes/{id}', 'Xem kết quả')}"></table>
    </section>
</main>
<script th:src="@{/js/training-end-refresh.js}"></script>
</body>
</html>
