<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều chuyển nhân sự — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminDashboard.css}">
</head>
<body>
<th:block th:if="${navRole == 'admin'}">
    <header th:replace="~{fragments/navbar :: admin('transfer')}"></header>
</th:block>
<th:block th:if="${navRole == 'manager'}">
    <header th:replace="~{fragments/navbar :: manager('transfer')}"></header>
</th:block>
<th:block th:if="${navRole == 'staff'}">
    <header th:replace="~{fragments/navbar :: staff('transfer')}"></header>
</th:block>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow" th:text="${eyebrow}">CoffeeHRM</div>
        <h1>Điều chuyển nhân sự</h1>
    </section>
    <section class="panel">
        <h2>Theo dõi điều chuyển</h2>
        <p class="empty" th:text="${summary}">Theo dõi điều chuyển nhân sự.</p>
    </section>
</main>
</body>
</html>
