<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục kỹ năng — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ManagerDashboard.css}">
    <link rel="stylesheet" th:href="@{/css/Training.css}">
</head>
<body th:attr="data-context=@{/}">
<header th:replace="~{fragments/navbar :: manager('training')}"></header>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Cửa hàng — Manager</div>
        <h1>Danh mục kỹ năng</h1>
        <p>
            <span th:text="${displayName}">Manager</span>
            <span th:if="${storeName}"> · <span th:text="${storeName}">Store</span></span>
        </p>
        <p class="muted"><a class="back-link" th:href="@{/training}">← Danh sách lớp đào tạo</a></p>
    </section>

    <p class="flash success" th:if="${successMessage}" th:text="${successMessage}">OK</p>
    <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}">Error</p>

    <section>
        <article class="panel">
            <h2>Danh mục kỹ năng</h2>
            <p>Xem danh mục kỹ năng đào tạo. Việc sửa và ngừng kỹ năng do Admin thực hiện.</p>

            <table>
                <thead>
                <tr>
                    <th>Kỹ năng</th>
                    <th>Mô tả</th>
                    <th>Yêu cầu</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(skills)}">
                    <td colspan="4" class="empty">Chưa có kỹ năng đào tạo.</td>
                </tr>
                <tr th:each="skill : ${skills}">
                    <td th:text="${skill.skillName}">Skill</td>
                    <td th:text="${skill.description} ?: '—'">Desc</td>
                    <td th:text="${skill.requirements} ?: '—'">Req</td>
                    <td>
                        <span class="badge" th:classappend="${skill.status.name() == 'ACTIVE'} ? ' badge-ok' : ' badge-off'"
                              th:text="${skill.status.dbValue}">Active</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </article>
    </section>
</main>
<script th:src="@{/js/ManagerDashboard.js}"></script>
<script th:src="@{/js/Training.js}"></script>
</body>
</html>
