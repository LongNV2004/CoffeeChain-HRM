<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo đề xuất tuyển nhân sự — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminDashboard.css}">
</head>
<body>
<header th:replace="~{fragments/navbar :: manager('recruitment')}"></header>
<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Cửa hàng — Manager</div>
        <h1>Tạo đề xuất tuyển nhân sự</h1>
        <p>Nhập thông tin ứng viên. Hệ thống chưa tạo tài khoản cho đến khi Admin duyệt.</p>
    </section>

    <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <section class="panel" style="max-width:640px;">
        <p th:if="${storeName == null}">Bạn chưa được gán làm quản lý cửa hàng nên chưa thể gửi đề xuất.</p>
        <form th:if="${storeName != null}"
              class="stack-form"
              th:action="@{/manager/recruitment/create}"
              th:object="${form}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>
                Cửa hàng
                <input type="text" th:value="${storeName}" readonly>
            </label>

            <label>
                Họ và tên
                <input type="text" th:field="*{fullName}" maxlength="100" required>
                <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </label>

            <label>
                Email
                <input type="email" th:field="*{email}" maxlength="100" required>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>

            <label>
                Số điện thoại
                <input type="text" th:field="*{phone}" maxlength="15" required>
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </label>

            <label>
                Địa chỉ
                <textarea th:field="*{address}" maxlength="255" rows="3"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
            </label>

            <div class="form-actions">
                <button class="primary-btn" type="submit">Gửi đề xuất</button>
                <a class="back-link" th:href="@{/manager/recruitment}">Quay lại danh sách</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
