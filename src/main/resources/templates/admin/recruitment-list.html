<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyệt đề xuất tuyển nhân sự — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminDashboard.css}">
</head>
<body>
<header th:replace="~{fragments/navbar :: admin('recruitment')}"></header>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Trụ sở — Admin</div>
        <h1>Yêu cầu tuyển dụng</h1>
        <p>Xem và phê duyệt đề xuất bổ sung nhân sự từ các cửa hàng.</p>
    </section>

    <section class="panel">
        <table>
            <thead>
            <tr>
                <th>Cửa hàng</th>
                <th>Số lượng</th>
                <th>Lý do</th>
                <th>Trạng thái</th>
                <th>Duyệt</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(requests)}">
                <td colspan="5" class="empty">Chưa có đề xuất tuyển nhân sự.</td>
            </tr>
            <tr th:each="request : ${requests}">
                <td th:text="${request.store.storeName}">Store</td>
                <td th:text="${request.requestedNumber}">0</td>
                <td th:text="${request.reason}">Reason</td>
                <td>
                    <span class="badge"
                          th:classappend="${request.status.name() == 'APPROVED'} ? ' badge-ok' : (${request.status.name() == 'REJECTED'} ? ' badge-off' : ' badge-wait')"
                          th:text="${request.status.dbValue}">Pending</span>
                </td>
                <td class="actions">
                    <form th:action="@{/admin/recruitment/{id}/approve(id=${request.id})}" method="post">
                        <button type="submit" class="primary-btn">Duyệt</button>
                    </form>
                    <form th:action="@{/admin/recruitment/{id}/reject(id=${request.id})}" method="post">
                        <button type="submit" class="logout-btn">Từ chối</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<script th:src="@{/js/AdminDashboard.js}"></script>
</body>
</html>
