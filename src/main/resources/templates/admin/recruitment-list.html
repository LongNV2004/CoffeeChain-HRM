<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyệt đề xuất tuyển nhân sự — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminDashboard.css}">
</head>
<body>
<header th:replace="~{fragments/navbar :: admin('recruitment')}"></header>
<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Trụ sở — Admin</div>
        <h1>Đề xuất tuyển nhân sự</h1>
        <p>Mỗi đề xuất có thể gồm nhiều nhân viên. Mở chi tiết để duyệt hoặc từ chối từng người.</p>
    </section>

    <p class="flash success" th:if="${successMessage}" th:text="${successMessage}"></p>
    <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <section class="panel">
        <h2>Bộ lọc</h2>
        <form class="filter-grid" th:action="@{/admin/recruitment}" method="get">
            <label>
                Cửa hàng
                <select name="storeId">
                    <option value="">Tất cả cửa hàng</option>
                    <option th:each="store : ${stores}"
                            th:value="${store.id}"
                            th:text="${store.storeName}"
                            th:selected="${storeId != null and storeId == store.id}">Store</option>
                </select>
            </label>
            <label>
                Manager
                <select name="managerId">
                    <option value="">Tất cả Manager</option>
                    <option th:each="manager : ${managers}"
                            th:value="${manager.id}"
                            th:text="${manager.name + ' — ' + manager.storeName}"
                            th:selected="${managerId != null and managerId == manager.id}">Manager</option>
                </select>
            </label>
            <label>
                Trạng thái đề xuất
                <select name="status">
                    <option value="">Tất cả trạng thái</option>
                    <option th:each="item : ${statuses}"
                            th:value="${item.name()}"
                            th:text="${item.label}"
                            th:selected="${selectedStatus == item}">Chờ duyệt</option>
                </select>
            </label>
            <label>
                Từ ngày
                <input type="date" name="createdFrom" th:value="${createdFrom}">
            </label>
            <label>
                Đến ngày
                <input type="date" name="createdTo" th:value="${createdTo}">
            </label>
            <div class="form-actions">
                <button class="primary-btn" type="submit">Lọc</button>
                <a class="back-link" th:href="@{/admin/recruitment}">Xóa lọc</a>
            </div>
        </form>

        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>Tên đề xuất</th>
                    <th>Manager</th>
                    <th>Cơ sở</th>
                    <th>Ngày gửi</th>
                    <th>Nhân viên</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="7" class="empty">Chưa có đề xuất tuyển nhân sự.</td>
                </tr>
                <tr th:each="request : ${requests}">
                    <td th:text="${request.title}">Tuyển barista</td>
                    <td th:text="${request.managerName}">Manager</td>
                    <td th:text="${request.storeName}">Store</td>
                    <td th:text="${request.createdAt != null} ? ${#temporals.format(request.createdAt, 'dd/MM/yyyy HH:mm')} : ''">01/01/2026</td>
                    <td>
                        <strong th:text="${request.totalCandidates}">0</strong>
                        <div class="muted" th:text="'Chờ ' + ${request.pendingCount} + ' · Duyệt ' + ${request.approvedCount} + ' · Từ chối ' + ${request.rejectedCount}">Chờ 0</div>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${request.status.name() == 'COMPLETED'} ? ' badge-ok' : (${request.status.name() == 'PARTIALLY_PROCESSED'} ? ' badge-partial' : ' badge-wait')"
                              th:text="${request.statusLabel}">Chờ duyệt</span>
                    </td>
                    <td><a class="row-link" th:href="@{/admin/recruitment/{id}(id=${request.id})}">Chi tiết</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
