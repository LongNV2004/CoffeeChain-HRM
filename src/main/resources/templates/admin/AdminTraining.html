<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đào tạo — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminDashboard.css}">
    <link rel="stylesheet" th:href="@{/css/Training.css}">
</head>
<body th:attr="data-now=${#temporals.format(vietnamNow, 'yyyy-MM-dd') + 'T' + #temporals.format(vietnamNow, 'HH:mm:ss')}">
<header th:replace="~{fragments/navbar :: admin('training')}"></header>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Trụ sở — Admin</div>
        <h1>Đào tạo</h1>
        <p>
            <span th:text="${displayName}">Admin</span>
        </p>
        <p class="actions" style="margin-top:12px;">
            <a class="primary-btn" th:href="@{/admin/training/create}">Tạo lớp đào tạo</a>
            <a class="primary-btn" th:href="@{/admin/training/skills}">Chứng chỉ nhân viên</a>
            <a class="primary-btn" th:href="@{/admin/training/management}">Chứng chỉ quản lý</a>
        </p>
    </section>

    <p class="flash success" th:if="${successMessage}" th:text="${successMessage}">OK</p>
    <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}">Error</p>

    <section class="panel">
        <div class="panel-head">
            <div>
                <h2>Lớp đang hoạt động</h2>
            </div>
        </div>

        <form class="filter-bar" th:action="@{/admin/training}" method="get">
            <label>Kỹ năng
                <select name="skillId">
                    <option value="">Tất cả kỹ năng</option>
                    <option th:each="skill : ${filterSkills}"
                            th:value="${skill.id}"
                            th:selected="${skillId != null and skillId == skill.id}"
                            th:text="${skill.skillName}">Skill</option>
                </select>
            </label>
            <label>Ngày
                <input type="date" name="date" th:value="${date}">
            </label>
            <label>Tìm kiếm
                <input type="search" name="keyword" placeholder="Tên lớp, cửa hàng, kỹ năng, giảng viên"
                       th:value="${keyword}">
            </label>
            <label>Sắp xếp giờ bắt đầu
                <select name="sortDir">
                    <option value="asc" th:selected="${sortDir == 'asc'}">Tăng dần</option>
                    <option value="desc" th:selected="${sortDir == 'desc'}">Giảm dần</option>
                </select>
            </label>
            <div class="filter-actions">
                <button class="primary-btn" type="submit">Lọc</button>
                <a class="back-link" th:href="@{/admin/training}">Xóa lọc</a>
            </div>
        </form>

        <table th:replace="~{fragments/trainingClassView :: activeTable(${classes}, '/admin/training/classes/{id}', 'Không có lớp đào tạo phù hợp.')}"></table>

        <nav class="pagination" th:if="${totalPages > 0}" aria-label="Phân trang danh sách lớp đang hoạt động">
            <a class="page-btn"
               th:classappend="${classPage.first} ? ' disabled'"
               th:href="${classPage.first} ? '#' : @{/admin/training(page=${currentPage - 1}, skillId=${skillId}, date=${date}, keyword=${keyword}, sortDir=${sortDir})}">Trang trước</a>
            <span class="page-numbers">
                <a th:each="p : ${#numbers.sequence(1, totalPages)}"
                   class="page-btn"
                   th:classappend="${p == currentPage} ? ' active'"
                   th:href="@{/admin/training(page=${p}, skillId=${skillId}, date=${date}, keyword=${keyword}, sortDir=${sortDir})}"
                   th:text="${p}">1</a>
            </span>
            <a class="page-btn"
               th:classappend="${classPage.last} ? ' disabled'"
               th:href="${classPage.last} ? '#' : @{/admin/training(page=${currentPage + 1}, skillId=${skillId}, date=${date}, keyword=${keyword}, sortDir=${sortDir})}">Trang tiếp theo</a>
        </nav>
    </section>

    <section class="panel" style="margin-top:16px;">
        <div class="panel-head">
            <div>
                <h2>Lớp đã kết thúc</h2>
            </div>
        </div>
        <table th:replace="~{fragments/trainingClassView :: endedTable(${endedClasses}, '/admin/training/classes/{id}', 'Xem chi tiết')}"></table>
    </section>
</main>
<script th:src="@{/js/AdminDashboard.js}"></script>
<script th:src="@{/js/training-end-refresh.js}"></script>
</body>
</html>
