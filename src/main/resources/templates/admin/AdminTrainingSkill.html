<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chứng chỉ nhân viên — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AdminDashboard.css}">
    <link rel="stylesheet" th:href="@{/css/Training.css}">
</head>
<body th:attr="data-context=@{/}">
<header th:replace="~{fragments/navbar :: admin('training')}"></header>

<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow">Trụ sở — Admin</div>
        <h1>Chứng chỉ nhân viên</h1>
        <p>
            <span th:text="${displayName}">Admin</span>
        </p>
        <p class="muted"><a class="back-link" th:href="@{/admin/training}">← Danh sách lớp</a></p>
    </section>

    <p class="flash success" th:if="${successMessage}" th:text="${successMessage}">OK</p>

    <section class="panel">
        <h2>Chứng chỉ nhân viên</h2>
        <h2>Thêm kỹ năng</h2>
        <form class="stack-form" th:action="@{/admin/training/skills}" th:object="${skillForm}" method="post">
            <p class="flash error" th:if="${skillError}" th:text="${skillError}">Error</p>
            <label>Tên kỹ năng
                <input type="text" th:field="*{skillName}" maxlength="100" pattern="[^0-9]*" title="Tên kỹ năng không được chứa số" required>
            </label>
            <label>Yêu cầu
                <textarea th:field="*{requirements}" maxlength="500" rows="2"></textarea>
            </label>
            <input type="hidden" name="certificateKind" value="STAFF">
            <button class="primary-btn" type="submit">Thêm kỹ năng</button>
        </form>
    </section>

    <section class="panel">
        <h2>Kỹ năng hiện có</h2>
        <p class="flash error" th:if="${errorMessage}" th:text="${errorMessage}">Error</p>
        <table>
            <thead>
            <tr>
                <th>Kỹ năng</th>
                <th>Yêu cầu</th>
                <th>Trạng thái</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(skills)}">
                <td colspan="4" class="empty">Chưa có kỹ năng đào tạo.</td>
            </tr>
            <tr th:each="skill : ${skills}"
                th:attr="data-id=${skill.id},data-name=${skill.skillName},data-requirements=${skill.requirements}">
                <td th:text="${skill.skillName}">Skill</td>
                <td th:text="${skill.requirements} ?: '—'">Req</td>
                <td>
                    <span class="badge" th:classappend="${skill.status.name() == 'ACTIVE'} ? ' badge-ok' : ' badge-off'"
                          th:text="${skill.status.dbValue}">Active</span>
                </td>
                <td class="actions">
                    <button type="button" class="link-btn edit-skill"
                            th:if="${skill.status.name() == 'ACTIVE'}">Sửa</button>
                    <form th:if="${skill.status.name() == 'ACTIVE'}"
                          th:action="@{/admin/training/skills/{id}/deactivate(id=${skill.id})}"
                          method="post"
                          data-coffee-confirm="Ngừng sử dụng kỹ năng này?"
                          data-coffee-title="Ngừng sử dụng kỹ năng"
                          data-coffee-ok="Ngừng"
                          data-coffee-tone="danger">
                        <button class="link-btn danger" type="submit">Ngừng</button>
                    </form>
                    <form th:if="${skill.status.name() == 'INACTIVE'}"
                          th:action="@{/admin/training/skills/{id}/activate(id=${skill.id})}"
                          method="post"
                          data-coffee-confirm="Kích hoạt lại kỹ năng này?"
                          data-coffee-title="Kích hoạt kỹ năng"
                          data-coffee-ok="Kích hoạt">
                        <button class="link-btn" type="submit">Kích hoạt</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <form id="update-skill-form" class="stack-form hidden"
              th:action="@{/admin/training/skills/0}"
              th:object="${updateSkillForm}"
              method="post">
            <h3>Cập nhật kỹ năng</h3>
            <p class="flash error" th:if="${skillUpdateError}" th:text="${skillUpdateError}">Error</p>
            <input type="hidden" id="editingSkillId" th:value="${editingSkillId}">
            <label>Tên kỹ năng
                <input type="text" th:field="*{skillName}" maxlength="100" pattern="[^0-9]*" title="Tên kỹ năng không được chứa số" required>
            </label>
            <label>Yêu cầu
                <textarea th:field="*{requirements}" maxlength="500" rows="2"></textarea>
            </label>
            <input type="hidden" name="certificateKind" value="STAFF">
            <div class="form-actions">
                <button class="primary-btn" type="submit">Lưu thay đổi</button>
                <button class="logout-btn" type="button" id="cancel-edit">Hủy</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/AdminDashboard.js}"></script>
<script th:src="@{/js/Training.js}"></script>
</body>
</html>
