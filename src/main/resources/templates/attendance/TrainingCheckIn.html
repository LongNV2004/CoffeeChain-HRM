<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm công đào tạo — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AttendanceHistory.css}">
</head>
<body>
<th:block th:if="${navbarRole == 'manager'}">
<header th:replace="~{fragments/navbar :: manager('attendance')}"></header>
</th:block>
<th:block th:if="${navbarRole == 'staff'}">
<header th:replace="~{fragments/navbar :: staff('attendance')}"></header>
</th:block>
<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow" th:text="${eyebrow}">Chấm công đào tạo</div>
        <h1>Chấm công đào tạo</h1>
        <p th:if="${clock != null}">
            <span th:text="${clock.employeeName}">Nhân viên</span>
            <span th:if="${clock.storeName != null}" th:text="'· ' + ${clock.storeName}">· Cửa hàng</span>
        </p>
    </section>

    <p class="flash-ok" th:if="${pageMessage}" th:text="${pageMessage}">Thành công</p>
    <p class="flash" th:if="${pageError}" th:text="${pageError}">Lỗi</p>

    <section class="panel" th:if="${clock != null and #lists.isEmpty(clock.sessions)}">
        <h2>Buổi đào tạo</h2>
        <p class="empty">Bạn không có buổi đào tạo cần chấm công hôm nay.</p>
    </section>

    <th:block th:if="${clock != null}">
    <section class="panel" th:each="session : ${clock.sessions}">
        <h2 th:text="${session.className}">Lớp đào tạo</h2>
        <p class="ip-line" th:text="${session.typeLabel}">Đào tạo tại cửa hàng</p>
        <p class="ip-line" th:text="${session.dateLabel}">10/10/2026</p>
        <p class="ip-line" th:text="${session.timeLabel}">08:00 – 12:00</p>
        <p class="note">Trạng thái: <strong th:text="${session.statusLabel}">Chưa Check-in</strong></p>
        <div class="clock-actions">
            <form class="gps-form" th:if="${session.canCheckIn}"
                  th:action="@{|${actionBase}/check-in|}" method="post" data-max-accuracy="50">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="classId" th:value="${session.classId}">
                <input type="hidden" name="latitude">
                <input type="hidden" name="longitude">
                <input type="hidden" name="accuracy">
                <button class="primary-btn" type="submit">Check-in</button>
            </form>
            <form class="gps-form" th:if="${session.canCheckOut}"
                  th:action="@{|${actionBase}/check-out|}" method="post" data-max-accuracy="50">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="classId" th:value="${session.classId}">
                <input type="hidden" name="latitude">
                <input type="hidden" name="longitude">
                <input type="hidden" name="accuracy">
                <button class="secondary-btn" type="submit">Check-out</button>
            </form>
        </div>
    </section>
    </th:block>

    <a class="link-btn" th:href="@{${chooseUrl}}">Chọn loại chấm công</a>
    <a class="link-btn" th:href="@{${historyUrl}}">Xem lịch sử</a>
</main>
<script th:src="@{/js/attendance-gps.js(v=5)}"></script>
</body>
</html>
