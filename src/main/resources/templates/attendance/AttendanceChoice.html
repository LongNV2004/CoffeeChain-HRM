<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm công — CoffeeHRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/AttendanceHistory.css}">
</head>
<body>
<th:block th:if="${navbarRole == 'manager'}">
<header th:replace="~{fragments/navbar :: manager('attendance')}"></header>
</th:block>
<th:block th:if="${navbarRole == 'staff'}">
<header th:replace="~{fragments/navbar :: staff('attendance')}"></header>
</th:block>
<main class="wrap dash-main">
    <section class="welcome">
        <div class="eyebrow" th:text="${eyebrow}">Chấm công</div>
        <h1>Chấm công</h1>
        <p>Chọn loại chấm công cần thực hiện.</p>
    </section>
    <section class="choice-grid">
        <a class="choice-card" th:href="@{${shiftUrl}}">
            <h2>Chấm công ca làm</h2>
            <p>Check-in và Check-out theo ca làm việc hiện tại.</p>
        </a>
        <a class="choice-card" th:href="@{${trainingUrl}}">
            <h2>Chấm công đào tạo</h2>
            <p>Check-in và Check-out theo buổi đào tạo được phân công.</p>
        </a>
    </section>
    <a class="link-btn" th:href="@{${historyUrl}}">Xem lịch sử chấm công</a>
</main>
</body>
</html>
