spring.application.name=coffee-hrm

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CoffeeHRM;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa

server.port=8081
server.servlet.context-path=/

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

coffee-hrm.security.remember-me.key=coffee-hrm-dev-remember-me
coffee-hrm.security.remember-me.seconds=604800

coffee-hrm.attendance.check-in-lead-minutes=60
coffee-hrm.attendance.late-threshold-minutes=20
coffee-hrm.attendance.late-checkout-threshold-minutes=120
coffee-hrm.attendance.training-late-threshold-minutes=10
coffee-hrm.attendance.training-absent-threshold-minutes=20
coffee-hrm.attendance.training-checkout-lead-minutes=5
coffee-hrm.attendance.photo-directory=storage/attendance-photos

# Chấm công xác thực theo IP mạng: IP lấy từ request.getRemoteAddr() (kết nối TCP thực tế).
# Mặc định không tin forwarding header (kể cả khi Spring Boot tự nhận môi trường cloud) để client không giả được IP.
# Nếu chạy sau reverse proxy (Nginx, Cloudflare...), đổi none thành native và bật dòng internal-proxies
# và thay regex bằng IP của proxy tin cậy; Tomcat chỉ nhận header từ proxy này rồi cập nhật getRemoteAddr().
server.forward-headers-strategy=none
#server.tomcat.remoteip.internal-proxies=10\.0\.0\.5
# Máy chủ chạy trong mạng cửa hàng (local/LAN): request từ IP nội bộ/loopback được tính là IP public của máy chủ
# (máy chủ tự tra, lưu tạm 300 giây). Không áp dụng cho request đi qua proxy/tunnel. Đặt false nếu máy chủ không đặt tại cửa hàng.
coffee-hrm.attendance.local-network-uses-server-public-ip=true
coffee-hrm.attendance.server-public-ip-cache-seconds=300
coffee-hrm.contract.file-directory=storage/contract-files

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=12MB
coffee-hrm.training.file-directory=storage/skill-documents

spring.thymeleaf.cache=false

server.servlet.session.timeout=30m

server.error.include-message=always
server.error.include-binding-errors=always

