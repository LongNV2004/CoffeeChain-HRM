spring.application.name=coffee-hrm
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CoffeeHRM;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa

server.port=8081
server.servlet.context-path=/

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

coffee-hrm.security.remember-me.key=coffee-hrm-dev-remember-me
coffee-hrm.security.remember-me.seconds=604800

spring.thymeleaf.cache=false

server.servlet.session.timeout=30m

server.error.include-message=always
server.error.include-binding-errors=always